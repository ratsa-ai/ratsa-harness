name: Release

# Tag 驱动的发布：push 一个 `v*` tag，就在原生 runner 上构建各平台二进制，
# 生成 checksums.txt，创建 GitHub Release 并上传全部产物。
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# 【重跑】不要用 Run 页面上的 "Re-run all jobs" —— 它沿用该 run 当时的提交里的
# 工作流，也就是 tag 指向的那个旧版本；工作流本身写错时重跑等于白跑。
# 正确做法是 Actions → Release → Run workflow，分支选 main，tag 填 v0.1.0。
# 这样用的是 main 上的当前工作流，去发布一个已存在的 tag，不需要动 tag。
#
# 【命名契约 —— 改这里必须同步改另外两处】
#   * npm/lib/platform.js 的 assetName()   —— npm 包装按这个拼下载 URL
#   * scripts/build-release.sh             —— 本地构建走同一套命名
# 产物名：ratsa-<version>-<os>-<arch>[.exe]，os ∈ {darwin,linux,windows}。
# 另外每个平台多传一份版本无关的稳定别名 ratsa-latest-<os>-<arch>[.exe]。
#
# 发布后该通道可用（见 README「环境变量」）：
#   RATSA_RELEASE_BASE=https://github.com/ratsa-ai/ratsa-harness/releases/download/v0.1.0
#
# 用原生 runner 而不是交叉编译：`ring` 有平台相关汇编，交叉编译容易踩坑；
# 而且 GitHub 的 runner 已预装 Rust，无需引入第三方 toolchain action。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag，例如 v0.1.0（注意：上方的 'Use workflow from' 必须保持 main，不能选这个 tag）"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # 先把「发布哪个 tag / 哪个版本」定下来，并做一致性校验。
  # 产物名里嵌了 version，如果 tag 和 Cargo.toml 对不上，用户按 tag 拼出来的
  # URL 会和实际资产名错位 —— 宁可在构建前就失败。
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 手动触发时发布指定 tag 的内容；tag push 时就用该 tag 自身。
          ref: ${{ inputs.tag || github.ref }}

      - id: resolve
        shell: bash
        env:
          # 经 env 传入而不是直接插进脚本，避免把外部输入拼进 shell。
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            # "Use workflow from" 下拉框必须是 main。若选了 tag，GitHub 加载的是
            # 那个 tag 里当时的工作流文件 —— main 上的修复一律不生效，而且会
            # 静默地按旧矩阵构建（踩过：选成 v0.1.0 后仍在跑 macos-13）。
            # GITHUB_REF_NAME 因此是那个 tag 而不是 main，这里直接拦下。
            if [ "${GITHUB_REF_TYPE}" != "branch" ]; then
              echo "::error::'Use workflow from' 必须选 main，当前是 ${GITHUB_REF_TYPE}:${GITHUB_REF_NAME} —— 选 tag 会用该 tag 里的旧工作流" >&2
              exit 1
            fi
            tag="$INPUT_TAG"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          case "$tag" in
            v*) ;;
            *) echo "::error::tag 必须以 v 开头，收到 '${tag}'" >&2; exit 1 ;;
          esac

          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ -z "$version" ]; then
            echo "::error::无法从 Cargo.toml 读出 version" >&2
            exit 1
          fi

          if [ "v${version}" != "${tag}" ]; then
            echo "::error::tag ${tag} 与 Cargo.toml 的 version ${version} 不一致" >&2
            exit 1
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "将发布 ${tag}（version ${version}）"

  build:
    needs: prepare
    # 一个平台挂了不要连坐，其余平台仍然产出，方便只重跑失败的那个。
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14 # Apple Silicon
            os: darwin
            arch: arm64
          # 故意不用 macos-13（Intel）：该 runner 已被 GitHub 弃用，实测排 10 分钟
          # 也拿不到机器，会一直卡在 queued。改成在 arm64 的 macos-14 上交叉编译
          # —— Apple 工具链本就能同时出 x86_64，比赌一个正在退役的 runner 稳。
          - runner: macos-14
            os: darwin
            arch: x64
            target: x86_64-apple-darwin
          # 用 22.04 而不是 ubuntu-latest：glibc 基线更低，老发行版上跑得起来。
          - runner: ubuntu-22.04
            os: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - runner: windows-latest
            os: windows
            arch: x64
          - runner: windows-11-arm
            os: windows
            arch: arm64

    runs-on: ${{ matrix.runner }}
    # 排队时间也算在 timeout 内：万一某个 runner label 失效，作业会在 30 分钟后
    # 明确失败，而不是无限期卡在 queued 把整个 release 拖住（macos-13 就是这样）。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: 准备交叉编译目标
        if: matrix.target != ''
        shell: bash
        run: rustup target add ${{ matrix.target }}

      # 不用 build-release.sh：那个脚本硬编码了 `--offline`，是给本地增量构建用的；
      # CI 是干净机器，依赖根本没进 cargo cache，--offline 必然失败。
      - name: 构建
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [ -n "$TARGET" ]; then
            cargo build --release --locked --target "$TARGET"
          else
            cargo build --release --locked
          fi

      - name: 按约定命名
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          ext=""
          if [ "$OS" = "windows" ]; then ext=".exe"; fi

          # 指定 --target 时产物落在 target/<triple>/release/，不是 target/release/
          if [ -n "$TARGET" ]; then
            src="target/${TARGET}/release/ratsa${ext}"
          else
            src="target/release/ratsa${ext}"
          fi

          if [ ! -f "$src" ]; then
            echo "::error::找不到构建产物 $src" >&2
            exit 1
          fi

          mkdir -p dist
          cp "$src" "dist/ratsa-${VERSION}-${OS}-${ARCH}${ext}"
          cp "$src" "dist/ratsa-latest-${OS}-${ARCH}${ext}"
          chmod +x dist/* 2>/dev/null || true

          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ratsa-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # checksums.txt 在这里统一生成：针对「即将上传的那批文件」算，而不是各平台各算一份再合并。
  release:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 生成 checksums.txt
        shell: bash
        working-directory: dist
        run: |
          set -euo pipefail
          # 用裸文件名（不要 ./*），否则 checksums.txt 里的路径会带 ./ 前缀，
          # 而 install.js 之后是按 basename 去查的。
          sha256sum * > checksums.txt
          echo "--- checksums.txt ---"
          cat checksums.txt

      - name: 创建或更新 Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail

          # 可重入：手动重跑时 release 已存在，走覆盖上传而不是报错退出。
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖上传"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "RATSA-Harness ${TAG}" \
              --generate-notes
          fi

          echo "=== 已发布资产 ==="
          gh release view "$TAG" --json assets --jq '.assets[].name'

      # ————————————————————————————————————————————————————————————————
      # 镜像到华为云 OBS。对象键 == URL 路径，固定前缀 downloads/，这样
      # ratsa.ai 的 nginx 只需把 /downloads/... 302 到桶域名，用 $request_uri
      # 原样拼接即可，不需要任何 rewrite。前缀固定也让重定向不可能寻址到
      # downloads/ 之外。
      # ————————————————————————————————————————————————————————————————

      # 凭据缺失时**跳过而不是失败**：fork、以及没配置镜像的部署不该因此变红。
      # 一旦配置了就阻塞 —— OBS 是 ratsa.ai/downloads 的实际服务端，不是备份。
      - name: 检查 OBS 凭据
        id: obs
        shell: bash
        env:
          OBS_AK: ${{ secrets.OBS_ACCESS_KEY_ID }}
          OBS_SK: ${{ secrets.OBS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail

          # 两个都没配 → 这个部署就是不镜像，跳过而非失败（fork、未启用镜像的部署不该变红）。
          if [ -z "$OBS_AK" ] && [ -z "$OBS_SK" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 OBS_ACCESS_KEY_ID / OBS_SECRET_ACCESS_KEY，跳过华为云镜像。GitHub Releases 仍是完整通道，但 ratsa.ai/downloads 不会更新。"
            exit 0
          fi

          # 只配了一半是最容易踩的坑：AK 在而 SK 缺时，aws CLI 要等到真正上传
          # 才报 "Partial credentials found in env, missing: AWS_SECRET_ACCESS_KEY"，
          # 信息埋在几十行日志里，看起来像上传失败而不是配置缺失。这里提前点名。
          missing=""
          [ -n "$OBS_AK" ] || missing="$missing OBS_ACCESS_KEY_ID"
          [ -n "$OBS_SK" ] || missing="$missing OBS_SECRET_ACCESS_KEY"
          if [ -n "$missing" ]; then
            echo "::error::以下仓库 Secret 不存在或为空：$missing 。两个都必须配。注意必须建在 Repository secrets（Settings → Secrets and variables → Actions → Repository secrets）；若是建在 Environment secrets，本作业读不到 —— 它没有声明 environment。"
            exit 1
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: 镜像到华为云 OBS
        if: steps.obs.outputs.enabled == 'true'
        shell: bash
        working-directory: dist
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OBS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OBS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-southeast-3
          # runner 上没有实例元数据服务，开着只会每次白等到超时
          AWS_EC2_METADATA_DISABLED: "true"
          # aws CLI v2 较新版本默认带 x-amz-checksum-crc32 与 aws-chunked 编码，
          # OBS 的 S3 兼容层不认，会报 SignatureDoesNotMatch 或解析失败。
          # 这两个变量不是可选的美化项，是能不能传上去的前提。
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          OBS_ENDPOINT: https://obs.ap-southeast-3.myhuaweicloud.com
          OBS_BUCKET: ratsa-ai
          OBS_PREFIX: downloads
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          # OBS **要求**虚拟主机名风格，也就是控制台里的「访问域名」
          # (bucket.obs.<region>.myhuaweicloud.com)。
          # 首跑实测：设成 path 会让每一个对象都失败，报
          #   VirtualHostDomainRequired: Virtual host domain is required
          #   while accessing a specific bucket.
          # 不要把它「优化」回 path —— 这行看着多余，实际是 OBS 的硬要求。
          aws configure set default.s3.addressing_style virtual
          aws --version
          S3="s3://${OBS_BUCKET}/${OBS_PREFIX}/"
          aws_s3() { aws s3 "$@" --endpoint-url "$OBS_ENDPOINT" --no-progress; }

          echo "=== 1) 带版本号的资产：内容永不变 → 长缓存 ==="
          # 刻意不加 --delete：旧版本的资产要留着，RATSA_VERSION=<旧版> 的安装才仍然可用
          aws_s3 cp . "$S3" --recursive \
            --exclude "ratsa-latest-*" --exclude "checksums*.txt" \
            --content-type application/octet-stream \
            --cache-control "public, max-age=31536000, immutable"

          echo "=== 2) 版本无关别名：每次发版都变 → 绝不能长缓存 ==="
          # 这里若图省事也套 immutable，已装过旧版的用户会一直拿到旧二进制：
          # URL 没变、缓存不失效，属于极难排查的故障。
          aws_s3 cp . "$S3" --recursive \
            --exclude "*" --include "ratsa-latest-*" \
            --content-type application/octet-stream \
            --cache-control "no-cache"

          echo "=== 3) checksums.txt 最后传 ==="
          # 它是校验的唯一权威。先传会出现「新清单 + 旧二进制」→ 用户校验失败。
          aws_s3 cp checksums.txt "${S3}checksums.txt" \
            --content-type "text/plain; charset=utf-8" \
            --cache-control "no-cache"
          # 再留一份带版本号的清单，让旧版本的安装日后仍然可校验
          aws_s3 cp checksums.txt "${S3}checksums-${VERSION}.txt" \
            --content-type "text/plain; charset=utf-8" \
            --cache-control "public, max-age=31536000, immutable"

          echo "=== OBS 现有对象 ==="
          # 纯展示。aws s3 cp 从本地往上传并不需要 ListBucket，所以这里列不出来
          # 不代表上传有问题 —— 不要让一条给人看的信息把发布判失败。
          aws_s3 ls "$S3" || echo "(列出失败：多半是该 IAM 用户没有 ListBucket 权限；上传本身不受影响)"

      # 这一步价值最高：一次抓出「桶策略没配好（403）」「前缀填错」
      # 「传上去的是 HTML 而不是二进制」「二进制跑不起来」。
      - name: OBS 冒烟测试
        if: steps.obs.outputs.enabled == 'true'
        shell: bash
        env:
          BASE: https://ratsa-ai.obs.ap-southeast-3.myhuaweicloud.com/downloads
        run: |
          set -euo pipefail

          # 匿名列举必须被拒绝。若允许，evals/ 那类「顺序ID_原始文件名」的可猜键
          # 会连同一切被一次性列出来，随机 token 提供的熵也就白费了。
          list_code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$BASE/" || true)
          if [ "$list_code" = "200" ]; then
            echo "::error::匿名可以列举 OBS（$BASE/ 返回 200）。这在 OBS 里几乎总是因为把「桶 ACL」设成了公共读 —— 桶 ACL 的 Read 权限会映射到 ListBucket/ListBucketVersions。请改用「桶策略」里的公共读模板：它含 GetObject 但明确不含 ListBucket。"
            exit 1
          fi
          echo "匿名列举被拒（HTTP $list_code），符合预期"

          # 匿名 GET，不带任何签名。403 说明桶策略没放通，nginx 跳过去也会是 403。
          code=$(curl -sS -o /tmp/ratsa -w '%{http_code}' --max-time 180 "$BASE/ratsa-latest-linux-x64")
          if [ "$code" != "200" ]; then
            echo "::error::OBS 匿名下载返回 $code（检查桶策略是否放通 downloads/* 的匿名 GetObject）"
            exit 1
          fi

          # 真的执行一次。runner 是 ubuntu-22.04，与构建该资产的基线一致。
          chmod +x /tmp/ratsa
          /tmp/ratsa --version

          # 清单与内容必须对得上
          curl -fsSL --max-time 60 "$BASE/checksums.txt" -o /tmp/checksums.txt
          want=$(awk '$2=="ratsa-latest-linux-x64"{print $1}' /tmp/checksums.txt)
          [ -n "$want" ] || { echo "::error::checksums.txt 里找不到 ratsa-latest-linux-x64"; exit 1; }
          got=$(sha256sum /tmp/ratsa | awk '{print $1}')
          [ "$want" = "$got" ] || { echo "::error::OBS 上的二进制与 checksums.txt 不一致"; exit 1; }
          echo "OBS 冒烟测试通过：匿名可读、可执行、哈希与清单一致"
